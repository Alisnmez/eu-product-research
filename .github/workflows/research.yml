name: EU opportunity discovery
on:
  push:
    branches: [main]
    paths:
      - 'discovery.py'
      - 'review_analysis.py'
      - 'evaluation.py'
      - 'quality_gate.py'
      - 'criteria.py'
      - 'tests/**'
      - '.github/workflows/research.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eu-opportunity-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit existing product evidence
        run: python quality_gate.py
      - name: Research customer problems
        run: python discovery.py
      - name: Persist evidence checkpoint
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Research checkpoint"
            git push
          fi
