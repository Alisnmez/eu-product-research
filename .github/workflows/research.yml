name: EU opportunity discovery
on:
  push:
    branches: [main]
    paths:
      - 'discovery.py'
      - 'review_analysis.py'
      - 'evaluation.py'
      - 'quality_gate.py'
      - 'criteria.py'
      - 'opportunity_pipeline.py'
      - 'research_health.py'
      - 'evidence_registry.py'
      - 'openfoodfacts_source.py'
      - 'tests/**'
      - '.github/workflows/research.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eu-opportunity-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit existing product evidence
        run: python quality_gate.py
      - name: Research customer problems
        run: python discovery.py
      - name: Collect actual public product catalogue
        run: python openfoodfacts_source.py
      - name: Validate and compile criterion evidence
        run: python evidence_registry.py
      - name: Build evidence-based opportunity queue
        run: python opportunity_pipeline.py
      - name: Publish operational health report
        run: python research_health.py
      - name: Upload research diagnostics even if a prior step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-diagnostics
          path: |
            data/openfoodfacts_status.json
            data/HEALTH.md
            data/CHECKPOINT.md
            data/evidence_rejections.json
          if-no-files-found: warn
          retention-days: 7
      - name: Persist evidence checkpoint
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Research checkpoint"
            git push
          fi
